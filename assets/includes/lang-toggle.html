<button id="lang-toggle-btn" type="button" aria-label="Switch language / Cambiar idioma">ES</button>

<style>
#lang-toggle-btn {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 1030;
  padding: 6px 14px;
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  background: rgba(255, 255, 255, 0.8);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: #0b0b0b;
  border: 1px solid rgba(11, 11, 11, 0.12);
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
}

#lang-toggle-btn:hover {
  transform: translateY(-1px);
  border-color: rgba(11, 11, 11, 0.3);
}

html[data-lang="en"] .lang-es { display: none !important; }
html[data-lang="es"] .lang-en { display: none !important; }
</style>

<script>
(function () {
  function applyLang(lang) {
    document.documentElement.setAttribute("data-lang", lang);
    var btn = document.getElementById("lang-toggle-btn");
    if (btn) btn.textContent = lang === "en" ? "ES" : "EN";
  }

  var saved = localStorage.getItem("site-lang") || "en";
  applyLang(saved);

  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("lang-toggle-btn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-lang") || "en";
      var next = current === "en" ? "es" : "en";
      localStorage.setItem("site-lang", next);
      applyLang(next);
    });
  });
})();
</script>
